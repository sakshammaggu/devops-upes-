version: '3'
services:
  wordpress_db:
    image: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: UPES
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress
    depends_on:
      - wordpress_db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: wordpress_db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: UPES

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    depends_on:
      - wordpress_db
    ports:
      - "8181:80"
    environment:
      PMA_HOST: wordpress_db
      MYSQL_ROOT_PASSWORD: UPES

volumes:
  db_data:
